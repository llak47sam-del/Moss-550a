<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大衍决·第四层总纲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "KaiTi", "STKaiti", "SimKai", serif;
            color: #e0d3c5;
            overflow: hidden;
            position: relative;
        }
        
        /* 背景粒子效果 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            background: rgba(224, 211, 197, 0.3);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .container {
            max-width: 800px;
            padding: 2rem;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        .header {
            margin-bottom: 2.5rem;
            position: relative;
        }
        
        .header::before,
        .header::after {
            content: "";
            position: absolute;
            height: 1px;
            background: linear-gradient(to right, transparent, #a89f91, transparent);
            width: 100px;
            top: 50%;
            left: -120px;
        }
        
        .header::after {
            left: auto;
            right: -120px;
        }
        
        h1 {
            font-size: 2.8rem;
            letter-spacing: 8px;
            margin: 1.5rem 0;
            text-shadow: 0 0 15px rgba(168, 159, 145, 0.7);
            position: relative;
            display: inline-block;
        }
        
        h1::before,
        h1::after {
            content: "☯";
            position: absolute;
            font-size: 1.8rem;
            top: 50%;
            transform: translateY(-50%);
        }
        
        h1::before {
            left: -2.5rem;
        }
        
        h1::after {
            right: -2.5rem;
        }
        
        .poem {
            font-size: 1.8rem;
            line-height: 2.4rem;
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(20, 18, 35, 0.6);
            border: 1px solid rgba(168, 159, 145, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(106, 90, 205, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .poem::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, transparent, #8a7f8d, transparent);
        }
        
        .poem::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, transparent, #8a7f8d, transparent);
        }
        
        .signature {
            font-size: 1.4rem;
            margin-top: 2rem;
            color: #b8a99a;
            letter-spacing: 3px;
        }
        
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.9rem;
            color: rgba(224, 211, 197, 0.4);
            transform: rotate(-90deg);
            transform-origin: bottom right;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
                letter-spacing: 5px;
            }
            
            .poem {
                font-size: 1.4rem;
                line-height: 2rem;
                padding: 1rem;
            }
            
            h1::before,
            h1::after {
                font-size: 1.4rem;
                left: -1.8rem;
                right: -1.8rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .poem {
                font-size: 1.2rem;
                line-height: 1.8rem;
            }
            
            .header::before,
            .header::after {
                width: 60px;
                left: -80px;
            }
            
            .header::after {
                right: -80px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景粒子 -->
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1>大衍决</h1>
        </div>
        
        <div class="poem">
            生老病死，因缘聚合。<br>
            世间纷繁，皆有其意。<br>
            迷之则轮回苦，<br>
            悟之则天地宽，<br>
            红尘勘破，大道可期。
        </div>
        
        <div class="signature">——大衍决，第四层，总纲</div>
    </div>
    
    <div class="watermark">道法自然 · 2025</div>

    <script>
        // 创建背景粒子效果
        document.addEventListener('DOMContentLoaded', function() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth > 768 ? 50 : 25;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // 随机位置
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                
                // 随机大小
                const size = Math.random() * 4 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // 随机动画延迟和持续时间
                const delay = Math.random() * 15;
                const duration = Math.random() * 20 + 10;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                
                particlesContainer.appendChild(particle);
            }
        });
    </script>
</body>
</html>
